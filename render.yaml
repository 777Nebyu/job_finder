# ==============================================================================
# Render.com Blueprint - Job Alert Bot Free Deployment
# ==============================================================================
services:
  - type: web
    name: job-alert-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "7860"
